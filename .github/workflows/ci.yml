name: ci

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - gcc:16
          - gcc:15
          - clang:23
          - clang:22
    container:
      image: "registry.gitlab.com/offa/docker-images/${{ matrix.compiler }}"
    name: "${{ matrix.compiler }}"
    steps:
      - uses: actions/checkout@main
      - uses: offa/conan-action@1132c2e396bf4af73f7196939c0d45e7359f63c8
      - name: Build
        run: script/ci_build.sh


  build_windows:
    runs-on: windows-latest
    name: "msvc"
    steps:
      - uses: actions/checkout@main
      - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: x64
      - uses: offa/conan-action@1132c2e396bf4af73f7196939c0d45e7359f63c8
      - name: Build
        run: script/ci_build.sh
        shell: bash


  formatting-check:
    name: "formatting"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674
      name: "Verify formatting"
      with:
        clang-format-version: 19

